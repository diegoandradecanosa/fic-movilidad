[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fic-movilidad"
version = "0.1.0"
description = "Aplicación de soporte al coordinador de movilidad de la Facultade de Informática (UDC)"
requires-python = ">=3.10"
dependencies = [
    "django>=5.1,<5.2",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.9"]

[tool.setuptools.packages.find]
include = ["config*", "movilidad*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
